name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  push:
    branches: [master, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'client/package.json'
      - 'client/package-lock.json'
  workflow_dispatch:

jobs:
  audit:
    name: Run Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit backend dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit frontend dependencies
        run: cd client && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate security report
        run: |
          echo "## Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "Backend: " >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate >> $GITHUB_STEP_SUMMARY || true
          echo -e "\nFrontend: " >> $GITHUB_STEP_SUMMARY
          cd client && npm audit --audit-level=moderate >> $GITHUB_STEP_SUMMARY || true
